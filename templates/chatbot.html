<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Chatbot | PRPCEM</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>


<body class="inner-page">

<div class="app">

    <!-- ================= TOPBAR ================= -->

    <header class="topbar">

        <a href="/" class="back-button">

            <span class="back-icon">
                ←
            </span>

            <span>
                Assistant Home
            </span>

        </a>


        <div class="topbar-brand">

            <div class="mini-logo">
                🤖
            </div>

            <div>

                <strong>
                    PRPCEM STUDENT ASSISTANT
                </strong>

                <small>
                    AI Chatbot
                </small>

            </div>

        </div>

    </header>


    <!-- ================= CHATBOT ================= -->

    <main class="chatbot-page">

        <div class="chatbot-container">


            <!-- CHAT HEADER -->

            <div class="chat-header">

                <div class="bot-profile">

                    <div class="bot-avatar">
                        🤖
                    </div>

                    <div>

                        <h1>
                            PRPCEM AI Assistant
                        </h1>

                        <p>
                            <span class="online-dot"></span>
                            Online • Ready to help
                        </p>

                    </div>

                </div>

            </div>


            <!-- CHAT AREA -->

            <div
                id="chat"
                class="chat-area"
            >

                <!-- Initial Bot Message -->

                <div class="message bot-message">

                    <div class="message-avatar">
                        🤖
                    </div>

                    <div class="message-content">

                        <div class="message-bubble">

                            Hello! 👋

                            <br><br>

                            I'm the PRPCEM Student Assistant.

                            Ask me anything related to the college.

                        </div>

                    </div>

                </div>

            </div>


            <!-- TYPING INDICATOR -->

            <div
                id="typing"
                class="typing-indicator"
                style="display: none;"
            >

                <span></span>
                <span></span>
                <span></span>

            </div>


            <!-- INPUT AREA -->

            <div class="chat-input-area">

                <input
                    id="message"
                    type="text"
                    placeholder="Ask something about PRPCEM..."
                    autocomplete="off"
                >

                <button
                    id="send"
                    class="send-button"
                    onclick="sendMessage()"
                >

                    <span>
                        ➤
                    </span>

                </button>

            </div>

        </div>

    </main>

</div>


<script>

    // ================= ELEMENTS =================

    const input = document.getElementById("message");

    const chat = document.getElementById("chat");

    const typing = document.getElementById("typing");

    const sendButton = document.getElementById("send");


    // ================= ADD MESSAGE =================

    function addMessage(text, type) {

        const message = document.createElement("div");

        message.className =
            "message " +
            (type === "user"
                ? "user-message"
                : "bot-message");


        // USER MESSAGE

        if (type === "user") {

            message.innerHTML = `
                <div class="message-content">

                    <div class="message-bubble">
                        ${escapeHtml(text)}
                    </div>

                </div>
            `;

        }


        // BOT MESSAGE

        else {

            message.innerHTML = `

                <div class="message-avatar">
                    🤖
                </div>

                <div class="message-content">

                    <div class="message-bubble">
                        ${formatBotMessage(text)}
                    </div>

                </div>

            `;

        }


        chat.appendChild(message);


        chat.scrollTo({

            top: chat.scrollHeight,

            behavior: "smooth"

        });

    }


    // ================= SECURITY =================

    function escapeHtml(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    // ================= FORMAT BOT MESSAGE =================

    function formatBotMessage(text) {

        if (!text) {
            return "";
        }

        // Escape HTML first for security

        text = escapeHtml(String(text));


        // Convert new lines into HTML breaks

        text = text.replace(/\n/g, "<br>");


        return text;

    }


    // ================= SEND MESSAGE =================

    async function sendMessage() {

        const text = input.value.trim();


        // Do nothing if input is empty

        if (!text) {
            return;
        }


        // Show user's message

        addMessage(text, "user");


        // Clear input

        input.value = "";


        // Disable input while processing

        input.disabled = true;

        sendButton.disabled = true;


        // Show typing animation

        typing.style.display = "flex";


        try {

            // Send request to Flask backend

            const response = await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );


            // Convert response to JSON

            const data = await response.json();


            // Small typing delay for natural interaction

            setTimeout(() => {

                typing.style.display = "none";


                // IMPORTANT:
                // Flask app.py returns the answer
                // using the "reply" key.

                if (response.ok && data.reply) {

                    addMessage(
                        data.reply,
                        "bot"
                    );

                }

                else if (data.error) {

                    addMessage(
                        data.error,
                        "bot"
                    );

                }

                else {

                    addMessage(
                        "Sorry, I couldn't process that.",
                        "bot"
                    );

                }


                // Enable input again

                input.disabled = false;

                sendButton.disabled = false;

                input.focus();

            }, 500);

        }


        catch (error) {

            console.error(
                "Chatbot Error:",
                error
            );


            typing.style.display = "none";


            addMessage(
                "Sorry, something went wrong while connecting to the server. Please try again.",
                "bot"
            );


            input.disabled = false;

            sendButton.disabled = false;

            input.focus();

        }

    }


    // ================= ENTER KEY =================

    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        }
    );

</script>

</body>

</html>
